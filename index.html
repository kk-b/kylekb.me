<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="kk-b — Full Stack Developer" />
    <title>kk-b</title>
    <!-- Prevent a flash of the wrong theme: runs before first paint.
         Light is the default, so only a remembered choice adds the class.
         Must stay in step with getInitial() in src/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <!-- Served in the static HTML so crawlers get the name without running JS.
         Visually hidden: the hero shows it as ASCII art, which is only decorative
         (the art is aria-hidden, so this heading is what gets announced). -->
    <h1 class="sr-only">Kyle Khuong-Bui</h1>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
