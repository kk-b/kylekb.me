name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # v5 runs on Node 24; v4 targeted the now-deprecated Node 20 runtime
      - uses: actions/setup-node@v5
        with:
          # Matches the local Node/npm that generates package-lock.json. npm 10
          # (bundled with Node 22) and npm 11 resolve bundled optional deps
          # differently, so a lock written by npm 11 makes `npm ci` on npm 10
          # fail with "Missing: @emnapi/core from lock file".
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
